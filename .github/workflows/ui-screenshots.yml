name: UI Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/ui-screenshots.yml"

jobs:
  tour:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Run the DEV tour harness (title-synced capture)
        shell: pwsh
        run: node scripts/tour-capture.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tour-screenshots
          path: ci-artifacts/tour
          if-no-files-found: error
